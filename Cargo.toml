[package]
name = "learning_bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
avian2d = "0.7.0"
bevy = { version = "0.19", default-features = false, features = ["2d", "dynamic_linking", "ui"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 0

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
